name: CI

# CPU-only Linux build + physics self-test + Python bindings/examples.
# CUDA and Intel MKL are optional accelerators and are deliberately NOT required here:
# reviewers (SciPost / arXiv readers) build on plain Linux without a GPU, so the default
# path must be green everywhere.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"   # nightly: run the FULL physics suite (push/PR run --quick)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-selftest:
    name: Linux CPU-only build + selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # GCC 14+ is required for the C++23 <print> header used by the CLI.
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++-14

      - name: Configure (CPU-only, no CUDA/MKL, no GUI)
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DCELERIS_BUILD_GUI=OFF
          -DCELERIS_USE_CUDA=OFF
          -DCELERIS_USE_MKL=OFF

      - name: Build CLI
        run: cmake --build build --target celeris -j

      # On push/PR: the fast subset (~seconds) so CI stays snappy.
      - name: Run physics self-test (quick subset)
        if: github.event_name != 'schedule'
        run: ./build/celeris selftest --quick

      # Nightly: the full 22-case locked regression suite.
      - name: Run physics self-test (full suite, nightly)
        if: github.event_name == 'schedule'
        run: ./build/celeris selftest

  python:
    name: Python bindings + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      - name: Build + install the celeris Python module (CPU-only)
        env:
          CMAKE_ARGS: "-DCELERIS_USE_CUDA=OFF -DCELERIS_USE_MKL=OFF -DCELERIS_BUILD_GUI=OFF"
        run: pip install -v .

      - name: Run a Python example
        run: python examples/python/01_focusing_lens.py
